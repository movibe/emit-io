name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'packages/*/CHANGELOG.md'
      - 'packages/*/package.json'
      - '.changeset/**'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Create auto patch changeset
        run: |
          # Derive package names from workspace package.json files
          FRONTMATTER=$(find packages -maxdepth 2 -name "package.json" ! -path "*/node_modules/*" \
            -exec node -e "const p=require(process.argv[1]); if(p.name && !p.private) console.log('\"'+p.name+'\": patch')" {} \;)
          FILE=".changeset/auto-patch-$(date +%s).md"
          printf -- "---\n%s\n---\n\nAuto patch release\n" "$FRONTMATTER" > "$FILE"

      - name: Version packages
        run: bun changeset version

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: version packages [skip ci]" || echo "Nothing to commit"
          git push

      - name: Build and publish
        run: bun run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
