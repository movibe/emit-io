pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "packages/**/*.{ts,tsx}"
      run: bunx biome check {staged_files} --no-errors-on-unmatched
      stage_fixed: true

pre-push:
  parallel: false
  commands:
    changeset-required:
      run: |
        BRANCH=$(git branch --show-current)
        if [[ "$BRANCH" == "feat/"* ]] || [[ "$BRANCH" == "fix/"* ]]; then
          if [ -z "$(ls .changeset/*.md 2>/dev/null | grep -v README)" ]; then
            echo ""
            echo "❌ No changeset found on branch: $BRANCH"
            echo ""
            echo "   Create one: bun run changeset"
            echo "   Then commit the .changeset/*.md file."
            echo ""
            echo "   No release needed? Skip with: git push --no-verify"
            echo ""
            exit 1
          fi
        fi
    typecheck:
      run: bun run typecheck 2>/dev/null || true
    tests:
      run: bun run test --run
